#commentaire
name: "Compilation du projet"
on: 
  push:
jobs:
  compilation:
    runs-on: ubuntu-latest
    steps:
      - name: "Va chercher le code sourcce"
        uses: actions/checkout@v5
      - name: "Setup up JDK 25"
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Ajouter droits
        run: chmod +x mvnw
      - name: Compile le projet
        run: './mvnw compile'

      - name: 'Execution tests'
        run: './mvnw test -D CalculatriceTest#additionnerDeuxNombresPositifs'
